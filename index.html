<!doctype html>
<meta charset="utf-8">
<title>ACPナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --ground:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EFF5;
  --ink:#12324A; --ink-2:#2A465B; --line:#C5D3DE;
  --calm:#1E5A80; --calm-bg:#E2EDF6; --on-calm:#FFFFFF;
  --urgent:#B23A2B; --urgent-bg:#FAE8E4; --on-urgent:#FFFFFF;
  --amber:#A8560F; --amber-bg:#FBEFE2;
  --focus:#C9661A;
  --radius:10px;
  font-family:"BIZ UDPGothic","Meiryo","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1820; --surface:#152431; --surface-2:#1C2F3E;
    --ink:#E4EDF3; --ink-2:#BCCDDA; --line:#2F4658;
    --calm:#8CC1E6; --calm-bg:#17334A; --on-calm:#0E1820;
    --urgent:#F29383; --urgent-bg:#3B1F1B; --on-urgent:#0E1820;
    --amber:#F2AE6B; --amber-bg:#3A2A18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1820; --surface:#152431; --surface-2:#1C2F3E;
  --ink:#E4EDF3; --ink-2:#BCCDDA; --line:#2F4658;
  --calm:#8CC1E6; --calm-bg:#17334A; --on-calm:#0E1820;
  --urgent:#F29383; --urgent-bg:#3B1F1B; --on-urgent:#0E1820;
  --amber:#F2AE6B; --amber-bg:#3A2A18;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto}
.brand h1{font-size:22px;margin:0;letter-spacing:.02em}
.brand span{font-size:14px;color:var(--ink-2)}
.search{flex:1 1 320px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px}
.search:focus-within{border-color:var(--focus)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;min-width:0}
.search svg{flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink-2);margin:0 0 8px}
h2{font-size:20px;margin:0 0 12px;text-wrap:balance}
h3{font-size:18px;margin:0 0 8px;text-wrap:balance}

/* step 1 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;display:grid;gap:4px}
.choice .k{font-size:13px;font-weight:700;letter-spacing:.06em}
.choice .t{font-size:20px;font-weight:700}
.choice .d{font-size:14px;color:var(--ink-2)}
.choice.calm .k{color:var(--calm)} .choice.urgent .k{color:var(--urgent)}
.choice.calm:hover,.choice.calm[aria-pressed="true"]{border-color:var(--calm);background:var(--calm-bg)}
.choice.urgent:hover,.choice.urgent[aria-pressed="true"]{border-color:var(--urgent);background:var(--urgent-bg)}

section.step{margin-top:24px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.subs{grid-template-columns:1fr}}
.sub{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px}
.sub b{display:block;font-size:16px}
.sub small{display:block;font-size:14px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.sub:hover{border-color:var(--ink-2)}
.sub[aria-pressed="true"]{border-color:var(--mode);background:var(--mode-bg);box-shadow:inset 4px 0 0 var(--mode)}

/* result */
.result{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.result-head{background:var(--mode);color:var(--on-mode);padding:14px 18px}
.result-head .crumb{font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.95}
.result-head h2{color:inherit;margin:2px 0 0;font-size:21px}
.result-body{padding:16px 18px;display:grid;gap:20px}
.summary{background:var(--mode-bg);border-radius:8px;padding:12px 14px;font-weight:700}
ol.flow{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:f}
ol.flow li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
ol.flow .n{width:40px;height:40px;border-radius:8px;background:var(--mode);color:var(--on-mode);display:grid;place-items:center;font-weight:700;font-size:17px}
ol.flow .n.lg{font-size:20px}
ol.flow b{display:block}
ol.flow p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.phrases{display:grid;gap:8px}
.phrase{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.phrase .tag{flex:none;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-top:2px}
.phrase q{flex:1;quotes:"「" "」";font-size:16px}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;padding:3px 10px}
.copy.done{border-color:var(--calm);color:var(--calm)}
ul.cautions{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.cautions li{background:var(--amber-bg);border-radius:8px;padding:8px 12px 8px 36px;position:relative}
ul.cautions li::before{content:"!";position:absolute;left:12px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.reset{border:0;background:none;text-decoration:underline;color:var(--ink-2);font-size:14px;padding:0}
.placeholder{margin-top:24px;border:1.5px dashed var(--line);border-radius:var(--radius);padding:18px;color:var(--ink-2)}

/* library */
aside.lib{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
@media (min-width:981px){aside.lib{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto}}
.lib-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.entries{display:grid;gap:8px}
details.kb{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.kb[open]{border-color:var(--ink-2)}
details.kb summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;gap:2px}
details.kb summary::-webkit-details-marker{display:none}
details.kb summary .cat{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
details.kb summary .ti{font-weight:700;font-size:16px}
details.kb .kb-body{padding:0 12px 12px;font-size:15px}
details.kb .kb-body p{margin:0 0 8px}
details.kb .kb-body ul{margin:0 0 8px;padding-left:1.2em}
details.kb .src{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
details.kb.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){details.kb.flash{animation:none}}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}
.grid4 div{background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.55}
.grid4 b{display:block;font-size:14px}
.tw{overflow-x:auto}
table.mini{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0 8px}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.mini th{background:var(--surface-2)}
.empty{color:var(--ink-2);font-size:15px;padding:8px 0}
footer.note{margin-top:28px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
mark{background:var(--amber-bg);color:inherit;padding:0 2px;border-radius:3px}

/* print menu */
.printwrap{position:relative;flex:none}
.printbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--ground);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.printmenu{position:absolute;right:0;top:calc(100% + 6px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(10,30,45,.18);padding:8px;display:grid;gap:4px;z-index:20}
.printmenu button{text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px}
.printmenu button:hover:not(:disabled){background:var(--surface-2)}
.printmenu button:disabled{opacity:.55;cursor:not-allowed}
.printmenu b{display:block;font-size:15px}
.printmenu small{display:block;font-size:13px;color:var(--ink-2);line-height:1.5}
.printnote{font-size:13px;color:var(--ink-2);background:var(--amber-bg);border-radius:8px;padding:8px 10px;margin:4px 0 0}
#print-area{display:none}

@media print{
  @page{size:A4;margin:14mm 13mm}
  :root,:root[data-theme="dark"]{color-scheme:light;
    --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#EEF3F7; --ink:#000000; --ink-2:#1A2A36; --line:#8FA3B3;
    --calm:#1E5A80; --calm-bg:#E6EFF6; --on-calm:#FFFFFF; --urgent:#9E2F22; --urgent-bg:#F8E6E2; --on-urgent:#FFFFFF;
    --amber:#8A4608; --amber-bg:#FBEFE2;}
  body{background:#fff;font-size:11pt;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,.wrap{display:none!important}
  #print-area{display:block}
  .p-doc h1{font-size:18pt;margin:0 0 2mm}
  .p-doc .p-meta{font-size:9.5pt;margin:0 0 5mm;border-bottom:1pt solid var(--line);padding-bottom:2mm}
  .p-scene{break-inside:auto;margin:0 0 6mm}
  .p-scene + .p-scene{break-before:page}
  .p-head{border-left:5pt solid var(--mode);background:var(--mode-bg);padding:2mm 4mm;margin:0 0 3mm}
  .p-head .crumb{font-size:9.5pt;font-weight:700}
  .p-head h2{font-size:14pt;margin:0}
  .p-sum{font-weight:700;margin:0 0 3mm}
  .p-doc h3{font-size:11.5pt;margin:4mm 0 1.5mm;border-bottom:.75pt solid var(--line);break-after:avoid}
  .p-flow{margin:0;padding:0;list-style:none}
  .p-flow li{display:grid;grid-template-columns:9mm 1fr;gap:2mm;margin:0 0 1.5mm;break-inside:avoid}
  .p-flow .n{border:1pt solid var(--mode);color:var(--mode);font-weight:700;text-align:center;border-radius:2mm;height:7mm;line-height:7mm}
  .p-flow b{display:block}
  .p-ph{margin:0;padding:0;list-style:none}
  .p-ph li{margin:0 0 1.2mm;break-inside:avoid}
  .p-ph .tag{display:inline-block;font-size:9pt;font-weight:700;border:.75pt solid var(--line);border-radius:1.5mm;padding:0 1.5mm;margin-right:2mm}
  .p-list{margin:0;padding-left:5mm}
  .p-kb{break-inside:avoid;border:.75pt solid var(--line);border-radius:2mm;padding:2.5mm 3.5mm;margin:0 0 3mm}
  .p-kb .cat{font-size:9pt;font-weight:700}
  .p-kb h3{border:0;margin:0 0 1mm}
  .p-kb p{margin:0 0 1.5mm}
  .p-kb ul,.p-kb ol{margin:0 0 1.5mm;padding-left:5mm}
  .p-kb .src{font-size:9pt;border-top:.5pt solid var(--line);padding-top:1mm;margin-top:1.5mm}
  .p-note{font-size:9pt;margin-top:6mm;border-top:.75pt solid var(--line);padding-top:2mm}
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>ACPナビ</h1><span>状況を選ぶと、進め方と使える言葉が出ます</span></div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="関連知識を検索（例：4分割法、ICD、NURSE）" autocomplete="off">
    </label>
    <div class="printwrap">
      <button class="printbtn" id="printbtn" aria-expanded="false" aria-controls="printmenu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>印刷
      </button>
      <div class="printmenu" id="printmenu" hidden>
        <button id="pr-current" disabled><b>表示中の場面</b><small>選んだ場面の進め方・フレーズ・注意点・関連知識</small></button>
        <button id="pr-mode"><b>非緊急／緊急のハンドブック</b><small>選んでいる側の全場面（未選択なら全8場面）</small></button>
        <button id="pr-all"><b>全場面＋関連知識（完全版）</b><small>8場面すべてと関連知識27項目</small></button>
        <button id="pr-kb"><b>関連知識だけ</b><small>いま絞り込んでいる項目（検索・カテゴリを反映）</small></button>
        <p class="printnote" id="printnote" hidden>このプレビュー画面では印刷できません。GitHub Pages 版か、ダウンロードしたHTMLファイルをブラウザで開いて印刷してください。</p>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <main>
      <section>
        <p class="eyebrow">ステップ 1</p>
        <h2>いまの状況は？</h2>
        <div class="choices">
          <button class="choice calm" id="m-nonurgent" data-mode="nonurgent" aria-pressed="false">
            <span class="k">非緊急ACP</span>
            <span class="t">回復の見込みがある・万が一に備えて</span>
            <span class="d">外来・安定期・退院前など。時間をかけて価値観を探る</span>
          </button>
          <button class="choice urgent" id="m-urgent" data-mode="urgent" aria-pressed="false">
            <span class="k">緊急ACP</span>
            <span class="t">差し迫った危機</span>
            <span class="d">急性増悪・ICU入室や挿管の判断など。5〜10分で方針を決める</span>
          </button>
        </div>
      </section>

      <section class="step" id="step2" hidden>
        <p class="eyebrow">ステップ 2</p>
        <h2 id="step2-title">どの場面ですか？</h2>
        <div class="subs" id="subs"></div>
      </section>

      <div class="placeholder" id="placeholder">状況を選ぶと、ここにおすすめの進め方・使えるフレーズ・注意点・関連知識が表示されます。</div>
      <article class="result" id="result" hidden></article>
    </main>

    <aside class="lib" id="lib" aria-label="関連知識">
      <div class="lib-head"><h2 style="margin:0">関連知識</h2><span class="count" id="count"></span></div>
      <div class="cats" id="cats"></div>
      <div class="entries" id="entries"></div>
    </aside>
  </div>

  <footer class="note">
    教育・実践支援のための資料です。個々の判断は、施設の方針と担当チームの臨床判断に従ってください。会話例・フレーズは例示です。文献情報は利用前に原典で確認してください。
  </footer>
</div>
<div id="print-area" aria-hidden="true"></div>

<script>
// ====================== 状況別のおすすめ ======================
const SCENES = {
  nonurgent: {
    label: "非緊急ACP",
    title: "どの場面ですか？",
    subs: [
      { id: "n-first", label: "初めて話す", hint: "外来・安定期。まだ価値観を聞いていない",
        head: "楽しみから始めて、下限ラインを本人の言葉で見つける",
        summary: "楽しみ → 生きがい → 気がかり → 生きている意味がない、の順に進み、本人にとって受け入れられない状態（下限ライン）を本人の言葉で特定する。1回で終わらせなくてよい。",
        flow: [
          ["導", "許可をとる", "「どなたにも伺っていること」と前置きし、悪い知らせではないことを伝える"],
          ["1", "楽しみ", "答えやすい話題で関係をつくり、日常の具体像をつかむ"],
          ["2", "生きがい", "役割・関係・誇りなど、価値観の核を知る"],
          ["3", "気がかり", "不安や恐れを言葉にしてもらう。感情が動いたら先に応える"],
          ["4", "生きている意味がない", "1・2で聞いた楽しみを物差しに「それができなくなったら？」と境界を探る"],
          ["深", "各段階で深める", "Tell me more／Why?／What else? を行き来し、表面的な答えで止めない"],
          ["締", "要約して返す", "本人の言葉で要約して確認。代理意思決定者を確認し、記録する"]
        ],
        phrases: [
          ["導入", "今日は、これからの治療や生活について、〇〇さんが大事にしていることを少し伺ってもいいですか。どなたにも伺っていることです。"],
          ["楽しみ", "最近、楽しみにしていることは何ですか。"],
          ["生きがい", "〇〇さんにとって、生きがいや張り合いになっていることは何ですか。"],
          ["気がかり", "これから先のことで、気がかりなことや心配なことはありますか。"],
          ["下限", "どんな状態になったら、〇〇さんにとって「これでは生きている意味がない」と感じると思いますか。"],
          ["下限（柔らかく）", "こうなったら、治療を続けるのはつらすぎる、と思うような状態はありますか。"],
          ["深める", "そう思われるのは、どうしてですか。何かきっかけになった経験がありますか。"],
          ["確認", "つまり〇〇さんにとっては、△△ができなくなることが一番受け入れがたい、ということで合っていますか。"]
        ],
        cautions: [
          "いきなり「延命治療を希望しますか」と聞かない",
          "「家族に迷惑をかけたくない」「寝たきりは嫌」で止めず、背景の理由まで聞く",
          "車椅子・寝たきりなどのスケールを患者に見せて選ばせない。障害を「悪い状態」と決めつけない",
          "話したくない様子なら、その日は段階4まで進めなくてよい"
        ],
        related: ["lowerline", "sicg", "nurse", "record", "surrogate", "mhlw", "trigger"]
      },
      { id: "n-review", label: "節目での見直し", hint: "再入院・治療選択の前・退院前カンファレンス",
        head: "前回の本人の言葉を起点に、今も同じかを確かめる",
        summary: "下限ラインは動く（response shift）。前回の記録から入り、今も同じかを確認し、今回の治療判断と結びつける。",
        flow: [
          ["1", "前回の記録を読む", "楽しみ・生きがい・下限ライン・代理意思決定者を確認しておく"],
          ["2", "前回の言葉から入る", "「前回、〇〇とおっしゃっていました」と本人の言葉を返す"],
          ["3", "変化を聞く", "変わっていれば、何がきっかけかを Why? で聞く"],

// ====================== 描画 ======================
const $ = (s) => document.querySelector(s);
const kbById = Object.fromEntries(KB.map((k) => [k.id, k]));
let mode = null, subId = null, cat = "すべて", query = "";

function setModeColors(m) {
  const r = document.documentElement.style;
  const main = document.querySelector("main");
  const v = m === "urgent" ? ["--urgent", "--urgent-bg", "--on-urgent"] : ["--calm", "--calm-bg", "--on-calm"];
  main.style.setProperty("--mode", `var(${v[0]})`);
  main.style.setProperty("--mode-bg", `var(${v[1]})`);
  main.style.setProperty("--on-mode", `var(${v[2]})`);
}

function selectMode(m) {
  mode = m; subId = null;
  document.querySelectorAll(".choice").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  setModeColors(m);
  const sc = SCENES[m];
  $("#step2").hidden = false;
  $("#step2-title").textContent = sc.title;
  const subs = $("#subs"); subs.innerHTML = "";
  sc.subs.forEach((s) => {
    const b = document.createElement("button");
    b.className = "sub"; b.id = "s-" + s.id; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<b>${s.label}</b><small>${s.hint}</small>`;
    b.addEventListener("click", () => selectSub(s.id));
    subs.appendChild(b);
  });
  $("#result").hidden = true; $("#placeholder").hidden = false;
  save();
}

function esc(t) { return t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function selectSub(id, noScroll) {
  subId = id;
  const sc = SCENES[mode]; const s = sc.subs.find((x) => x.id === id);
  document.querySelectorAll(".sub").forEach((b) => b.setAttribute("aria-pressed", String(b.id === "s-" + id)));
  const r = $("#result");
  r.innerHTML = `
    <div class="result-head"><div class="crumb">${sc.label} ／ ${s.label}</div><h2>${s.head}</h2></div>
    <div class="result-body">
      <div class="summary">${s.summary}</div>
      <div><h3>おすすめの進め方</h3><ol class="flow">${s.flow.map((f) => `<li><span class="n${s.big ? " lg" : ""}">${f[0]}</span><div><b>${f[1]}</b><p>${f[2]}</p></div></li>`).join("")}</ol></div>
      <div><h3>そのまま使えるフレーズ</h3><div class="phrases">${s.phrases.map((p, i) => `<div class="phrase"><span class="tag">${p[0]}</span><q>${esc(p[1])}</q><button class="copy" data-i="${i}" aria-label="このフレーズをコピー">コピー</button></div>`).join("")}</div></div>
      <div><h3>気をつけること</h3><ul class="cautions">${s.cautions.map((c) => `<li>${c}</li>`).join("")}</ul></div>
      <div><h3>関連知識</h3><div class="rel">${s.related.map((k) => kbById[k] ? `<button class="chip" data-kb="${k}">${kbById[k].title}</button>` : "").join("")}</div></div>
      <div><button class="reset" id="reset">最初からやり直す</button></div>
    </div>`;
  r.hidden = false; $("#placeholder").hidden = true;
  r.querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => copyPhrase(b, s.phrases[+b.dataset.i][1])));
  r.querySelectorAll("[data-kb]").forEach((b) => b.addEventListener("click", () => openKb(b.dataset.kb)));
  $("#reset").addEventListener("click", reset);
  if (!noScroll) r.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  save();
}

function copyPhrase(btn, text) {
  const done = () => { btn.textContent = "コピー済み"; btn.classList.add("done"); setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("done"); }, 1600); };
  try {
    navigator.clipboard.writeText(text).then(done, () => selectText(btn));
  } catch (e) { selectText(btn); }
}
function selectText(btn) {
  const q = btn.parentElement.querySelector("q");
  const range = document.createRange(); range.selectNodeContents(q);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  btn.textContent = "選択しました";
}

function reset() {
  mode = null; subId = null;
  document.querySelectorAll(".choice").forEach((b) => b.setAttribute("aria-pressed", "false"));
  $("#step2").hidden = true; $("#result").hidden = true; $("#placeholder").hidden = false;
  window.scrollTo({ top: 0 });
  save();
}

// ---- library ----
function renderCats() {
  const el = $("#cats"); el.innerHTML = "";
  CATS.forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", String(c === cat));
    b.addEventListener("click", () => { cat = c; renderCats(); renderKb(); });
    el.appendChild(b);
  });
}
function plain(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }
function hl(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return text.slice(0, i) + "<mark>" + text.slice(i, i + q.length) + "</mark>" + text.slice(i + q.length);
}
function renderKb() {
  const q = query.trim();
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = KB.filter((k) => (cat === "すべて" || k.cat === cat) &&
    terms.every((t) => (k.title + " " + k.tags + " " + plain(k.body) + " " + k.cat).toLowerCase().includes(t)));
  $("#count").textContent = `${list.length} / ${KB.length} 件`;
  const el = $("#entries");
  if (!list.length) { el.innerHTML = `<p class="empty">「${esc(q)}」に当てはまる項目はありません。別の言葉で探すか、カテゴリを「すべて」にしてください。</p>`; return; }
  el.innerHTML = list.map((k) => `<details class="kb" id="kb-${k.id}"${terms.length && list.length <= 3 ? " open" : ""}>
    <summary><span class="cat">${k.cat}</span><span class="ti">${hl(k.title, terms[0])}</span></summary>
    <div class="kb-body">${k.body}<div class="src">出典：${k.src}</div></div></details>`).join("");
}
function openKb(id) {
  if (cat !== "すべて" || query) { cat = "すべて"; query = ""; $("#q").value = ""; renderCats(); renderKb(); }
  const d = document.getElementById("kb-" + id); if (!d) return;
  d.open = true; d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash");
  d.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

$("#q").addEventListener("input", (e) => {
  query = e.target.value; renderKb();
  if (matchMedia("(max-width:980px)").matches && query) $("#lib").scrollIntoView({ block: "start" });
});
document.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => selectMode(b.dataset.mode)));

function save() { try { localStorage.setItem("acpnavi", JSON.stringify({ mode, subId })); } catch (e) {} }
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem("acpnavi") || "null");
    if (s && s.mode && SCENES[s.mode]) { selectMode(s.mode); if (s.subId) selectSub(s.subId, true); }
  } catch (e) {}
}

// ---- print ----
const MODEVARS = {
  nonurgent: "--mode:var(--calm);--mode-bg:var(--calm-bg)",
  urgent: "--mode:var(--urgent);--mode-bg:var(--urgent-bg)"
};
function pScene(m, s) {
  const sc = SCENES[m];
  return `<section class="p-scene" style="${MODEVARS[m]}">
    <div class="p-head"><div class="crumb">${sc.label} ／ ${s.label}（${s.hint}）</div><h2>${s.head}</h2></div>
    <p class="p-sum">${s.summary}</p>
    <h3>おすすめの進め方</h3>
    <ol class="p-flow">${s.flow.map((f) => `<li><span class="n">${f[0]}</span><div><b>${f[1]}</b>${f[2]}</div></li>`).join("")}</ol>
    <h3>そのまま使えるフレーズ</h3>
    <ul class="p-ph">${s.phrases.map((p) => `<li><span class="tag">${p[0]}</span>「${esc(p[1])}」</li>`).join("")}</ul>
    <h3>気をつけること</h3>
    <ul class="p-list">${s.cautions.map((c) => `<li>${c}</li>`).join("")}</ul>
    <h3>関連知識</h3>
    <p>${s.related.map((k) => kbById[k] ? kbById[k].title : "").filter(Boolean).join("／")}</p>
  </section>`;
}
function pKb(list) {
  return `<section class="p-scene"><div class="p-head" style="--mode:var(--ink);--mode-bg:var(--surface-2)"><div class="crumb">関連知識</div><h2>知っておくとよい情報（${list.length}項目）</h2></div>
    ${list.map((k) => `<div class="p-kb"><div class="cat">${k.cat}</div><h3>${k.title}</h3>${k.body}<div class="src">出典：${k.src}</div></div>`).join("")}</section>`;
}
function filteredKb() {
  const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return KB.filter((k) => (cat === "すべて" || k.cat === cat) &&
    terms.every((t) => (k.title + " " + k.tags + " " + plain(k.body) + " " + k.cat).toLowerCase().includes(t)));
}
function doPrint(title, inner) {
  const d = new Date();
  const date = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  $("#print-area").innerHTML = `<div class="p-doc"><h1>ACPナビ：${title}</h1><p class="p-meta">印刷日 ${date}　／　教育・実践支援のための資料。個々の判断は施設の方針と担当チームの臨床判断に従ってください。</p>${inner}
    <p class="p-note">フレーズ・会話例は例示です。文献情報は利用前に原典で確認してください。</p></div>`;
  closeMenu();
  setTimeout(() => { try { window.print(); } catch (e) {} }, 50);
}
const allScenes = (m) => SCENES[m].subs.map((s) => pScene(m, s)).join("");
$("#pr-current").addEventListener("click", () => {
  if (!mode || !subId) return;
  const s = SCENES[mode].subs.find((x) => x.id === subId);
  doPrint(`${SCENES[mode].label}／${s.label}`, pScene(mode, s) + pKb(s.related.map((k) => kbById[k]).filter(Boolean)));
});
$("#pr-mode").addEventListener("click", () => {
  if (mode) doPrint(`${SCENES[mode].label} ハンドブック`, allScenes(mode));
  else doPrint("全場面ハンドブック", allScenes("nonurgent") + allScenes("urgent"));
});
$("#pr-all").addEventListener("click", () => doPrint("完全版", allScenes("nonurgent") + allScenes("urgent") + pKb(KB)));
$("#pr-kb").addEventListener("click", () => {
  const list = filteredKb();
  doPrint("関連知識" + (query.trim() ? `（検索：${query.trim()}）` : cat !== "すべて" ? `（${cat}）` : ""), pKb(list.length ? list : KB));
});

let framed = false;
try { framed = window.self !== window.top; } catch (e) { framed = true; }
$("#printnote").hidden = !framed;
function openMenu() {
  $("#pr-current").disabled = !(mode && subId);
  $("#printmenu").hidden = false; $("#printbtn").setAttribute("aria-expanded", "true");
}
function closeMenu() { $("#printmenu").hidden = true; $("#printbtn").setAttribute("aria-expanded", "false"); }
$("#printbtn").addEventListener("click", (e) => { e.stopPropagation(); $("#printmenu").hidden ? openMenu() : closeMenu(); });
document.addEventListener("click", (e) => { if (!e.target.closest(".printwrap")) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("afterprint", () => { $("#print-area").innerHTML = ""; });

renderCats(); renderKb(); restore();
</script>
